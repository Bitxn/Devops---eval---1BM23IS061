# shopping_cart_deployment.yaml
# NOTE: As given in the exercise this uses namespace "devops-exercise", but the
# Service below is in "default". A Service only selects Pods in its OWN namespace,
# so the shopping-cart-service would match zero pods. To make it work, change this
# to "namespace: default" (or create the namespace and move the Service too).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart
  namespace: devops-exercise
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopping-cart
  template:
    metadata:
      labels:
        app: shopping-cart
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: shopping-cart
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: shopping-cart-container
        image: shopping-cart:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
